spring:
  application:
    name: Dodu
  datasource:
    url: jdbc:postgresql://localhost:${DODU_DB_PORT:5432}/${DODU_DB_NAME:dodu}
    username: ${DODU_DB_USERNAME:dodu}
    password: ${DODU_DB_PASSWORD:dodu}
  flyway:
    locations: classpath:db/migration

# 참가자 입장 코드 해시용 서버 비밀 값(pepper). 환경변수로만 주입하며 저장소에 값을 적지 않습니다.
# 비어 있거나 32바이트보다 짧으면 서버가 시작되지 않습니다.
dodu:
  access:
    code-pepper: ${DODU_ACCESS_CODE_PEPPER:}
    # Empty by default: forwarded client-IP headers are ignored until the deployment proxy is explicitly allowlisted.
    trusted-proxies: ${DODU_TRUSTED_PROXIES:}
  photo-storage:
    provider: ${DODU_PHOTO_STORAGE_PROVIDER:none}
    supabase-url: ${DODU_SUPABASE_URL:}
    bucket: ${DODU_PHOTO_BUCKET:dodu-photos}
    service-role-key: ${DODU_SUPABASE_SERVICE_ROLE_KEY:}

# API 문서(swagger). 기본은 꺼져 있고, 개발 환경에서만 DODU_SWAGGER_ENABLED=true 로 켭니다.
springdoc:
  api-docs:
    enabled: ${DODU_SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${DODU_SWAGGER_ENABLED:false}
