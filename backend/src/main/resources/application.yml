spring:
  application:
    name: Dodu
  datasource:
    url: ${DODU_DB_URL:jdbc:postgresql://localhost:${DODU_DB_PORT:5432}/${DODU_DB_NAME:dodu}}
    username: ${DODU_DB_USERNAME:dodu}
    password: ${DODU_DB_PASSWORD:dodu}
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 7MB

server:
  port: ${PORT:8080}

# 참가자 입장 코드 해시용 서버 비밀 값(pepper). 환경변수로만 주입하며 저장소에 값을 적지 않습니다.
# 비어 있거나 32바이트보다 짧으면 서버가 시작되지 않습니다.
dodu:
  web:
    # Comma-separated exact browser origins. Keep the production list explicit.
    allowed-origins: ${DODU_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  access:
    code-pepper: ${DODU_ACCESS_CODE_PEPPER:}
    # Empty by default: forwarded client-IP headers are ignored until the deployment proxy is explicitly allowlisted.
    trusted-proxies: ${DODU_TRUSTED_PROXIES:}
  photo-storage:
    provider: ${DODU_PHOTO_STORAGE_PROVIDER:none}
    supabase-url: ${DODU_SUPABASE_URL:}
    bucket: ${DODU_PHOTO_BUCKET:dodu-photos}
    service-role-key: ${DODU_SUPABASE_SERVICE_ROLE_KEY:}
  promise:
    daily-limit:
      # 하루(KST) 1약속 제한. 개발자 QA 기간에만 false로 두고, 실제 참가자 운영 전 다시 켠다.
      enabled: ${DODU_PROMISE_DAILY_LIMIT_ENABLED:true}
  photo-evaluation:
    result-api:
      # 사진 판정 결과 직접 저장 API. 참가자 세션 인증이라 운영에서는 끈다(복구 워커가 판정 저장).
      enabled: ${DODU_PHOTO_RESULT_API_ENABLED:false}
    immediate:
      # 사진 제출 커밋 직후 판정 시작. 끄면 30초 주기 워커만 판정한다(이전 동작).
      enabled: ${DODU_PHOTO_EVAL_IMMEDIATE_ENABLED:true}
      threads: ${DODU_PHOTO_EVAL_THREADS:2}
      queue-capacity: ${DODU_PHOTO_EVAL_QUEUE_CAPACITY:20}

  push:
    fcm:
      enabled: ${DODU_FCM_ENABLED:false}
      credentials-path: ${DODU_FCM_CREDENTIALS_PATH:}
      dry-run: ${DODU_FCM_DRY_RUN:false}

# API 문서(swagger). 기본은 꺼져 있고, 개발 환경에서만 DODU_SWAGGER_ENABLED=true 로 켭니다.
springdoc:
  api-docs:
    enabled: ${DODU_SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${DODU_SWAGGER_ENABLED:false}
